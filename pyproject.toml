[project]
name = "asia_hms_integration"
version = "0.1.0"
description = "Dr. Sara Cardio Care and Health Cube Pharmacy integration"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "ASIA HMS Team"}]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
healthcare = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 100
target-version = "py314"
